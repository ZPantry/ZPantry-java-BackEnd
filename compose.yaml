services:
  database:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_DB: zpantry_dev
      POSTGRES_USER: zpantry_dev
      POSTGRES_PASSWORD: password
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zpantry_dev -d zpantry_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - zpantry-dev-postgres:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - zpantry-ollama:/root/.ollama

  ollama-model-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    entrypoint: ["sh", "-c", "ollama pull \"$$OLLAMA_MODEL\""]
    restart: "no"

volumes:
  zpantry-dev-postgres:
  zpantry-ollama:
