services:
  database:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_DB: zpantry_dev
      POSTGRES_USER: zpantry_dev
      POSTGRES_PASSWORD: password
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zpantry_dev -d zpantry_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - zpantry-dev-postgres:/var/lib/postgresql/data
volumes:
  zpantry-dev-postgres:
