services:
  database:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_DB: zpantry_local
      POSTGRES_USER: zpantry_local
      POSTGRES_PASSWORD: zpantry_local_only
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zpantry_local -d zpantry_local"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - zpantry-local-postgres:/var/lib/postgresql/data

volumes:
  zpantry-local-postgres:
