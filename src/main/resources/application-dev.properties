# Development only. Values are synthetic and match compose.yaml.
spring.datasource.url=${ZPANTRY_dev_DB_URL:jdbc:postgresql://localhost:15432/zpantry_dev}
spring.datasource.username=${ZPANTRY_dev_DB_USERNAME:zpantry_dev}
spring.datasource.password=${ZPANTRY_dev_DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
zpantry.security.jwt.secret=${ZPANTRY_SECURITY_JWT_SECRET:this-is-a-local-dev-jwt-secret-that-is-at-least-32-bytes}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate

# The workspace compose stack is started explicitly. Do not start this legacy per-repository
# compose file from an IDE: its database port would conflict with the workspace database.
spring.docker.compose.enabled=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
ADMIN_EMAIL=admin@zpantry.com
ADMIN_PASSWORD=admin1234
