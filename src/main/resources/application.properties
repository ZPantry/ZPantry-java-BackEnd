spring.application.name=z_pantry_backend
spring.config.import=optional:file:.env[.properties]

spring.profiles.active=${ZPANTRY_PROFILE_ACTIVE:dev}
# Running from an IDE/Maven without an explicit profile uses only the disposable dev database.
# Deployments must set an explicit environment profile and datasource configuration.
spring.profiles.default=dev
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
# No Flyway writes until the existing schema has an approved baseline.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
# Supply SPRING_DATASOURCE_URL/USERNAME/PASSWORD externally. No live DB defaults.
# Protected User routes remain fail-closed unless legacy JWT validation is explicitly configured.
zpantry.security.jwt.enabled=true
zpantry.security.jwt.secret=${ZPANTRY_SECURITY_JWT_SECRET:}
zpantry.security.jwt.issuer=${ZPANTRY_SECURITY_JWT_ISSUER:}
zpantry.security.jwt.audience=${ZPANTRY_SECURITY_JWT_AUDIENCE:}
zpantry.security.jwt.access-token-minutes=${ZPANTRY_SECURITY_JWT_ACCESS_TOKEN_MINUTES:60}
zpantry.security.jwt.refresh-token-days=${ZPANTRY_SECURITY_JWT_REFRESH_TOKEN_DAYS:7}
zpantry.admin.bootstrap.enabled=${ZPANTRY_ADMIN_BOOTSTRAP_ENABLED:true}
zpantry.email.resend.api-key=${ZPANTRY_EMAIL_RESEND_API_KEY:}
zpantry.email.from=${ZPANTRY_EMAIL_FROM:}
zpantry.media.cloudinary.cloud-name=${ZPANTRY_MEDIA_CLOUDINARY_CLOUD_NAME:}
zpantry.media.cloudinary.api-key=${ZPANTRY_MEDIA_CLOUDINARY_API_KEY:}
zpantry.media.cloudinary.api-secret=${ZPANTRY_MEDIA_CLOUDINARY_API_SECRET:}
zpantry.ai.service-url=${AI_SERVICE_URL:http://localhost:8000}
zpantry.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
zpantry.ollama.model=${OLLAMA_MODEL:qwen2.5:3b}
zpantry.cors.allowed-origins=${ZPANTRY_CORS_ALLOWED_ORIGINS:*}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Google client Id
google.client.id=${GOOGLE_WEB_CLIENT_ID}
