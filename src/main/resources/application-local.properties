# Local development only. Values are synthetic and match compose.yaml.
spring.datasource.url=${ZPANTRY_LOCAL_DB_URL:jdbc:postgresql://localhost:54329/zpantry_local}
spring.datasource.username=${ZPANTRY_LOCAL_DB_USERNAME:zpantry_local}
spring.datasource.password=${ZPANTRY_LOCAL_DB_PASSWORD:zpantry_local_only}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate

spring.docker.compose.enabled=true
spring.docker.compose.file=compose.yaml
