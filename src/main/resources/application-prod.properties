# dev development only. Values are synthetic and match compose.yaml.
spring.datasource.url=${ZPANTRY_dev_DB_URL:jdbc:postgresql://localhost:15432/zpantry}
spring.datasource.username=${ZPANTRY_dev_DB_USERNAME:zpantry_dev}
spring.datasource.password=${ZPANTRY_dev_DB_PASSWORD:zpantry_dev_only}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
zpantry.admin.bootstrap.enabled=true


spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.main.lazy-initialization=true
spring.jpa.open-in-view=false
server.tomcat.threads.max=20
server.port=${PORT:8080}


spring.docker.compose.enabled=false
